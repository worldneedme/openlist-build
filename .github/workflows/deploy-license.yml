name: Deploy License Worker

# 云匣 Pro 授权服务（Rust Worker + D1）的构建与部署。
#
# 源码在私有仓 worldneedme/openlist-license，这里用只读 deploy key 拉取，
# 源码不会出现在这个 public 仓里。
# 放在 public 仓跑是为了用免费的 Actions 分钟（私有仓受账号计费限制）。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private license source
        uses: actions/checkout@v4
        with:
          repository: worldneedme/openlist-license
          ref: main
          ssh-key: ${{ secrets.LICENSE_READ_KEY }}
          persist-credentials: false

      - name: Install Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + worker-build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          # 不缓存 target：RUSTFLAGS 变化不会让 cargo 自动失效，
          # 复用旧 target 会让 -wasm-use-legacy-eh 悄悄不生效。
          key: ${{ runner.os }}-cargo-license-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-license-

      - name: Ensure worker-build
        run: |
          # crates.io 索引偶尔超时，带重试
          for i in 1 2 3; do
            if command -v worker-build >/dev/null 2>&1; then break; fi
            echo "installing worker-build (attempt $i)"
            cargo install worker-build --locked || cargo install worker-build || true
            sleep 5
          done
          command -v worker-build >/dev/null 2>&1 || { echo "::error title=NoWorkerBuild::worker-build 安装失败"; exit 1; }
          worker-build --version || true

      - name: Warm cargo index (with retry)
        run: |
          # worker-build 内部会跑 `cargo metadata`，它要拉 crates.io 索引；
          # 这一步提前预热 + 重试，避免构建中途超时。
          export CARGO_NET_RETRY=10
          export CARGO_HTTP_TIMEOUT=120
          export CARGO_HTTP_MULTIPLEXING=false
          for i in 1 2 3 4; do
            echo "cargo fetch (attempt $i)"
            if cargo fetch; then echo "index warm"; break; fi
            sleep $((i * 10))
          done
          cargo metadata --format-version 1 > /dev/null && echo "metadata OK"
          worker-build --version || true

      - name: Ensure wrangler
        run: npm install -g wrangler@4

      - name: Resolve D1 database (create if missing)
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          ACC="${CLOUDFLARE_ACCOUNT_ID}"

          ID="$(curl -sS -H "$AUTH" "$API/accounts/$ACC/d1/database?per_page=100" \
                 | jq -r '.result[]? | select(.name=="openlist-license") | .uuid' | head -1)"

          if [ -z "${ID:-}" ] || [ "$ID" = "null" ]; then
            echo "D1 database not found, creating via REST API..."
            RESP="$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                      -d '{"name":"openlist-license"}' "$API/accounts/$ACC/d1/database")"
            echo "$RESP"
            ID="$(echo "$RESP" | jq -r '.result.uuid // empty')"
          fi

          if [ -z "${ID:-}" ]; then
            echo "::error title=D1Missing::无法获取 D1 database id"
            exit 1
          fi
          echo "D1_ID=$ID"
          sed -i "s/__D1_ID__/$ID/g" wrangler.toml
          grep -n "database_id" wrangler.toml
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: wrangler d1 execute openlist-license --remote --file=./migrations/0001_init.sql

      - name: Push worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.LICENSE_ADMIN_TOKEN }}
          SIGNING_KEY: ${{ secrets.LICENSE_SIGNING_KEY }}
        run: |
          set -e
          printf '%s' "$ADMIN_TOKEN" | wrangler secret put ADMIN_TOKEN
          printf '%s' "$SIGNING_KEY" | wrangler secret put SIGNING_KEY

      - name: Deploy worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # worker-build 里层的 `cargo metadata` 会继承这些，避免索引超时
          CARGO_NET_RETRY: "10"
          CARGO_HTTP_TIMEOUT: "120"
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -o pipefail
          wrangler deploy 2>&1 | tee /tmp/deploy.log
          # 绑定了自定义域名后，workers.dev 入口会返回 1042，所以要优先用自定义域名。
          URL="$(grep -oE 'https://license\.[a-zA-Z0-9._-]+' /tmp/deploy.log | head -1 || true)"
          if [ -z "$URL" ]; then
            URL="$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' /tmp/deploy.log | head -1 || true)"
          fi
          echo "URL=$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 自定义域名是长期入口，优先测它
          URL="https://license.020021.qzz.io"
          echo "target: $URL"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/health"; then
              echo ""
              echo "health OK"
              exit 0
            fi
            echo "retry $i"
            sleep 5
          done
          echo "::error title=HealthFailed::/health 未通过"
          echo "=== 完整响应 ==="
          curl -sS -i "$URL/health" || true
          echo "=== 最近部署 ==="
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/openlist-license/deployments" \
            | head -c 1500 || true
          exit 1
