name: Build APK (public mirror)

# Public build-only repo for openlist-downloader.
# The private source is fetched with a read-only deploy key, so the source
# code is never published in this public repository.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source branch, tag or commit to build
        required: true
        default: fix/android-native-interactions
        type: string

permissions:
  contents: read

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: worldneedme/openlist-downloader
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          SDK=$ANDROID_HOME
          mkdir -p "$SDK/cmdline-tools"
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/assemble.log || {
            echo "::error title=AssembleFailed::gradle assembleDebug failed"
            grep -E "(error:|FAILURE:|FAILED|cannot find symbol|package .* does not exist)" /tmp/assemble.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=CompileError::$line"
            done
            exit 1
          }

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/test.log || {
            echo "::error title=TestFailed::gradle testDebugUnitTest failed"
            grep -E "(error:|FAILURE:|FAILED|AssertionError|Exception|expected:|but was:)" /tmp/test.log | head -n 40 | while IFS= read -r line; do
              echo "::error title=TestError::$line"
            done
            exit 1
          }

      - name: Upload unit test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openlist-downloader-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
