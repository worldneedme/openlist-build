name: Build APK (public mirror)

# Public build-only repo for openlist-downloader.
# The private source is fetched with a read-only deploy key, so the source
# code is never published in this public repository.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Private source ref: master (stable) or dev (testing)'
        required: true
        default: master
        type: string

permissions:
  contents: read

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: worldneedme/openlist-downloader
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          SDK=$ANDROID_HOME
          mkdir -p "$SDK/cmdline-tools"
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Gradle 由仓库内的 wrapper 提供，版本与 AGP 匹配（见 gradle-wrapper.properties）。
      # 不再手动下载固定版本，避免「CI 的 Gradle 版本」和「仓库声明的版本」两套事实。
      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/assemble.log || {
            echo "::error title=AssembleFailed::gradle assembleDebug failed"
            grep -E "(error:|FAILURE:|FAILED|cannot find symbol|package .* does not exist|Unsupported class file)" /tmp/assemble.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=CompileError::$line"
            done
            exit 1
          }

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee /tmp/test.log || {
            echo "::error title=TestFailed::gradle testDebugUnitTest failed"
            grep -E "(error:|FAILURE:|FAILED|AssertionError|Exception|expected:|but was:)" /tmp/test.log | head -n 40 | while IFS= read -r line; do
              echo "::error title=TestError::$line"
            done
            exit 1
          }

      # P0-3：release 包。有 KEYSTORE_BASE64 时用固定签名，没有则回落 debug 签名，
      # 保证 secret 未配置时也能出包做冒烟测试（签名指纹会变，仅用于测试）。
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            echo "使用固定 release 签名"
          else
            echo "::warning title=NoKeystore::未配置 KEYSTORE_BASE64，release 包回落 debug 签名（仅供冒烟，不可分发）"
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/release.log || {
            echo "::error title=ReleaseFailed::gradle assembleRelease failed"
            grep -E "(error:|FAILURE:|FAILED|R8|Missing class|cannot find symbol)" /tmp/release.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=ReleaseError::$line"
            done
            exit 1
          }
          echo "--- 签名指纹 ---"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools/35.0.0" -name apksigner | head -n 1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "SHA-256|DN:" || true

      # Artifact 配额满时 APK 改走私有仓 apk 分支（可写 deploy key SOURCE_WRITE_KEY）。
      # 单提交孤儿分支，每次 force push 覆盖，不累积历史。APK 存私有仓，保持不公开。
      - name: Push APK to private repo (apk branch)
        if: success()
        env:
          WRITE_KEY: ${{ secrets.SOURCE_WRITE_KEY }}
        run: |
          set -e
          STAGE=/tmp/apkstage
          mkdir -p "$STAGE"
          cp app/build/outputs/apk/debug/*.apk "$STAGE/app-debug.apk" 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk "$STAGE/app-release.apk" 2>/dev/null || true
          ls -la "$STAGE"
          if [ ! -f "$STAGE/app-release.apk" ] && [ ! -f "$STAGE/app-debug.apk" ]; then
            echo "::error title=ApkPushFailed::no APK files found"
            exit 1
          fi
          SRC_SHA=$(git rev-parse --short HEAD)
          printf 'run=%s\nref=%s\nsrc=%s\nbuilt=%s\n' \
            "${{ github.run_id }}" "${{ inputs.source_ref }}" "$SRC_SHA" \
            "$(date -u +%FT%TZ)" > "$STAGE/INFO.txt"
          mkdir -p /tmp/apkssh
          echo "$WRITE_KEY" > /tmp/apkssh/id_ed25519
          chmod 600 /tmp/apkssh/id_ed25519
          export GIT_SSH_COMMAND="ssh -i /tmp/apkssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/apkssh/known_hosts"
          cd "$STAGE"
          git init -q -b apk
          git config user.name "ci-apk-bot"
          git config user.email "ci-apk-bot@users.noreply.github.com"
          git remote add origin git@github.com:worldneedme/openlist-downloader.git
          git add -A
          git commit -q -m "apk: run ${{ github.run_id }} ref ${{ inputs.source_ref }} @ $SRC_SHA"
          git push -q -f origin apk || {
            echo "::error title=ApkPushFailed::git push to private repo apk branch failed"
            exit 1
          }
          echo "APK pushed to worldneedme/openlist-downloader branch apk (src=$SRC_SHA)"

      - name: Upload unit test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openlist-downloader-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openlist-downloader-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
